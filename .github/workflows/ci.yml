name: CI

# Gate every PR (and pushes to main) on schema validity + both apps building.
# No database is needed: prisma validate/generate, nest build, and vite build
# are all offline. Runtime/integration tests run separately.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API (schema + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prisma validate
        run: npx prisma validate --schema=../../prisma/schema.prisma
      - name: Prisma generate
        run: npx prisma generate --schema=../../prisma/schema.prisma
      - name: Build (nest / tsc)
        run: npm run build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (tsc -b + vite build)
        run: npm run build
